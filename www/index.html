<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snd-Worlds MMORPG 2D Sandbox</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 4px solid #334155;
            border-radius: 8px;
            background: #1e293b;
        }
        canvas {
            display: block;
            background: #090d16;
        }
        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            font-size: 14px;
            pointer-events: none;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2 style="margin: 0 0 10px 0; color: #38bdf8;">⚔️ Snd-Worlds MMORPG 2D Sandbox</h2>

    <div id="game-container">
        <div class="ui-panel" id="ui-stats">
            <strong>Héroe:</strong> Carlos_Vanguard<br>
            <strong>Ubicación:</strong> El Refugio (Zona Inicial)<br>
            <strong>Nivel:</strong> 1 | <strong>XP:</strong> 0/100<br>
            <strong>Metales:</strong> 💠 Cores: 5 | 🥈 Plata: 100 | 🪙 Oro: 10 | 💎 Diam.: 1
        </div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="controls-hint">
        Usa las teclas <b>W, A, S, D</b> o las <b>Flechas del Teclado</b> para moverte por el mundo 2D. Acércate a los enemigos o recursos.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Estado del jugador
        let player = {
            x: 400,
            y: 225,
            size: 20,
            speed: 3,
            color: '#38bdf8'
        };

        // Controles de teclado
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Entidades del mundo (Enemigos y recursos de metales)
        let entities = [
            { x: 200, y: 150, type: 'enemy', color: '#ef4444', size: 16, name: 'Bestia de Miasma' },
            { x: 600, y: 300, type: 'resource', color: '#eab308', size: beta = 14, name: 'Veta de Oro' },
            { x: 150, y: 350, type: 'resource', color: '#a855f7', size: 14, name: 'Núcleo de Cores' },
            { x: 650, y: 100, type: 'enemy', color: '#ef4444', size: 16, name: 'Sombra Corrupta' }
        ];

        function update() {
            // Movimiento fluido con W, A, S, D
            if ((keys['w'] || keys['arrowup']) && player.y > player.size) player.y -= player.speed;
            if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.size) player.y += player.speed;
            if ((keys['a'] || keys['arrowleft']) && player.x > player.size) player.x -= player.speed;
            if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.size) player.x += player.speed;

            // Colisiones con entidades
            entities.forEach((ent, index) => {
                let dist = Math.hypot(player.x - ent.x, player.y - ent.y);
                if (dist < player.size + ent.size) {
                    if (ent.type === 'resource') {
                        alert(`¡Has recolectado recursos de ${ent.name}!`);
                        entities.splice(index, 1);
                    } else if (ent.type === 'enemy') {
                        alert(`¡Te has encontrado con ${ent.name}! Combate iniciado.`);
                        player.x -= 30; // Retroceso táctico
                    }
                }
            });
        }

        function draw() {
            // Limpiar pantalla (Fondo del mundo 2D)
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar cuadrícula del mapa (Suelo de El Refugio)
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // Dibujar entidades (enemigos y recursos)
            entities.forEach(ent => {
                ctx.fillStyle = ent.color;
                ctx.beginPath();
                ctx.arc(ent.x, ent.y, ent.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = '11px sans-serif';
                ctx.fillText(ent.name, ent.x - 20, ent.y - 20);
            });

            // Dibujar al jugador (Héroe 2D)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Nombre del héroe sobre el personaje
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('Carlos_Vanguard', player.x - 40, player.y - 28);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
