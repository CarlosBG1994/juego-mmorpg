<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego MMORPG Survivor</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { touch-action: none; }
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let cursors;
    let enemies;
    let score = 0;
    let scoreText;
    let spawnTimer;

    function preload() {
        // Textura del jugador (Verde)
        let graphicsPlayer = this.make.graphics({x: 0, y: 0, add: false});
        graphicsPlayer.fillStyle(0x00ff00, 1);
        graphicsPlayer.fillRect(0, 0, 32, 32);
        graphicsPlayer.generateTexture('playerSprite', 32, 32);

        // Textura del enemigo (Rojo)
        let graphicsEnemy = this.make.graphics({x: 0, y: 0, add: false});
        graphicsEnemy.fillStyle(0xff0000, 1);
        graphicsEnemy.fillRect(0, 0, 28, 28);
        graphicsEnemy.generateTexture('enemySprite', 28, 28);
    }

    function create() {
        this.add.text(400, 30, 'MMORPG SURVIVOR - Mundo Abierto', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);
        
        scoreText = this.add.text(400, 60, 'Enemigos derrotados: 0', { fontSize: '16px', fill: '#00ffcc' }).setOrigin(0.5);

        // Crear jugador en el centro
        player = this.physics.add.sprite(400, 300, 'playerSprite');
        player.setCollideWorldBounds(true);

        // Grupo de enemigos
        enemies = this.physics.add.group();

        // Controles de teclado
        cursors = this.input.keyboard.createCursorKeys();

        // Controles táctiles para móvil (tocar para mover)
        this.input.on('pointerdown', (pointer) => {
            this.physics.moveToObject(player, pointer, 220);
        });

        // Generar enemigos cada 1.5 segundos automáticamente
        spawnTimer = this.time.addEvent({
            delay: 1500,
            callback: spawnEnemy,
            callbackScope: this,
            loop: true
        });

        // Colisión entre jugador y enemigos
        this.physics.add.overlap(player, enemies, hitEnemy, null, this);
    }

    function spawnEnemy() {
        if (!player || !player.active) return;

        // Aparecer aleatoriamente en los bordes del mapa
        let x = Phaser.Math.Between(0, 800);
        let y = Phaser.Math.Between(0, 600);
        
        // Evitar que salgan justo encima del jugador
        if (Phaser.Math.Distance.Between(x, y, player.x, player.y) < 200) {
            x = 50;
            y = 50;
        }

        let enemy = enemies.create(x, y, 'enemySprite');
        enemy.setCollideWorldBounds(true);
    }

    function hitEnemy(player, enemy) {
        // Al tocar un enemigo, lo destruimos y sumamos puntos
        enemy.destroy();
        score += 1;
        scoreText.setText('Enemigos derrotados: ' + score);
    }

    function update() {
        if (!player) return;

        player.setVelocity(0);

        // Movimiento por teclado
        if (cursors.left.isDown) player.setVelocityX(-220);
        else if (cursors.right.isDown) player.setVelocityX(220);

        if (cursors.up.isDown) player.setVelocityY(-220);
        else if (cursors.down.isDown) player.setVelocityY(220);

        // Hacer que todos los enemigos persigan al jugador constantemente
        enemies.getChildren().forEach((enemy) => {
            this.physics.moveToObject(enemy, player, 110);
        });
    }
</script>

</body>
</html>
