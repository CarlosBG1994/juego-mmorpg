<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Mapas y Facciones - MMORPG Sandbox</title>
    <style>
        body { margin: 0; background: #0b0f19; color: #f8fafc; font-family: system-ui, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        
        #sidebar { width: 300px; background: #1e293b; border-right: 2px solid #334155; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 10; overflow-y: auto; }
        h1 { font-size: 18px; color: #38bdf8; margin-top: 0; margin-bottom: 5px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        
        .tool-group { margin-bottom: 20px; }
        .tool-group label { font-size: 12px; font-weight: bold; color: #cbd5e1; display: block; margin-bottom: 8px; text-transform: uppercase; }
        
        .btn-tool { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #334155; border: 1px solid #475569; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background 0.2s, transform 0.1s; text-align: left; }
        .btn-tool:hover { background: #475569; }
        .btn-tool.active { background: #0284c7; border-color: #38bdf8; font-weight: bold; }
        
        .color-indicator { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }

        .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
        .btn-action { padding: 10px; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-action:hover { background: #ef4444; }
        
        .instructions { font-size: 11px; color: #64748b; background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 15px; line-height: 1.4; }

        #canvas-container { flex-grow: 1; position: relative; background: #0f172a; cursor: grab; overflow: hidden; }
        #canvas-container:active { cursor: grabbing; }
        canvas { display: block; }

        #hud { position: absolute; top: 15px; right: 15px; background: rgba(30, 41, 59, 0.85); padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; font-size: 12px; pointer-events: none; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>🗺️ Constructor de Mundos</h1>
        <p>Diseña tu mapa, expande territorios y ubica tus ciudades y mazmorras.</p>

        <div class="tool-group">
            <label>Seleccionar Elemento a Colocar:</label>
            <button class="btn-tool active" onclick="setTool('city', this)"><span class="color-indicator" style="background:#b45309;"></span> Ciudad Principal</button>
            <button class="btn-tool" onclick="setTool('port', this)"><span class="color-indicator" style="background:#1e40af;"></span> Puerto Marítimo</button>
            <button class="btn-tool" onclick="setTool('dungeon', this)"><span class="color-indicator" style="background:#7f1d1d;"></span> Mazmorra PvP (1h)</button>
            <button class="btn-tool" onclick="setTool('ruins', this)"><span class="color-indicator" style="background:#581c87;"></span> Ruinas Antiguas</button>
            <button class="btn-tool" onclick="setTool('forest', this)"><span class="color-indicator" style="background:#166534;"></span> Bosque / Zona Recolección</button>
            <button class="btn-tool" onclick="setTool('mountain', this)"><span class="color-indicator" style="background:#475569;"></span> Montaña / Minerales</button>
        </div>

        <div class="tool-group">
            <label>Acciones de Mapa:</label>
            <button class="btn-tool" onclick="resetZoom()" style="justify-content: center; background: #1e293b;">🔍 Centrar / Restablecer Vista</button>
        </div>

        <div class="instructions">
            💡 <b>Controles:</b><br>
            • <b>Clic Izquierdo:</b> Colocar elemento.<br>
            • <b>Rueda del Ratón:</b> Alejar / Agrandar mapa (Zoom).<br>
            • <b>Clic y Arrastrar:</b> Moverse por el mundo.
        </div>

        <div class="actions">
            <button class="btn-action" onclick="clearMap()">🗑️ Borrar Todo el Mapa</button>
        </div>
    </div>

    <div id="canvas-container">
        <div id="hud">Zoom: 100% | Elementos: 0</div>
        <canvas id="worldMap"></canvas>
    </div>

<script>
    const canvas = document.getElementById('worldMap');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const hud = document.getElementById('hud');

    const WORLD_WIDTH = 4000;
    const WORLD_HEIGHT = 4000;

    let currentTool = 'city';
    let elements = [];

    let camera = {
        x: WORLD_WIDTH / 2 - 400,
        y: WORLD_HEIGHT / 2 - 300,
        zoom: 1,
        isDragging: false,
        startX: 0,
        startY: 0
    };

    const toolConfig = {
        city: { name: 'Ciudad', color: '#b45309', size: 50, icon: '🏛️' },
        port: { name: 'Puerto', color: '#1e40af', size: 40, icon: '⚓' },
        dungeon: { name: 'Mazmorra', color: '#7f1d1d', size: 45, icon: '🔥' },
        ruins: { name: 'Ruinas', color: '#581c87', size: 40, icon: '🗿' },
        forest: { name: 'Bosque', color: '#166534', size: 60, icon: '🌲' },
        mountain: { name: 'Montaña', color: '#475569', size: 55, icon: '⛰️' }
    };

    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function setTool(tool, btn) {
        currentTool = tool;
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
    }

    function clearMap() {
        if(confirm('¿Seguro que quieres borrar todos los elementos del mapa?')) {
            elements = [];
        }
    }

    function resetZoom() {
        camera.zoom = 1;
        camera.x = WORLD_WIDTH / 2 - canvas.width / 2;
        camera.y = WORLD_HEIGHT / 2 - canvas.height / 2;
    }
    resetZoom();

    container.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
            camera.isDragging = true;
            camera.startX = e.clientX;
            camera.startY = e.clientY;
            camera.hasMoved = false;
        }
    });

    container.addEventListener('mousemove', (e) => {
        if (camera.isDragging) {
            const dx = e.clientX - camera.startX;
            const dy = e.clientY - camera.startY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                camera.hasMoved = true;
            }
            camera.x -= dx / camera.zoom;
            camera.y -= dy / camera.zoom;
            camera.startX = e.clientX;
            camera.startY = e.clientY;
        }
    });

    container.addEventListener('mouseup', (e) => {
        if (camera.isDragging && !camera.hasMoved && e.button === 0) {
            const rect = canvas.getBoundingClientRect();
            const clickScreenX = e.clientX - rect.left;
            const clickScreenY = e.clientY - rect.top;

            const worldX = clickScreenX / camera.zoom + camera.x;
            const worldY = clickScreenY / camera.zoom + camera.y;

            elements.push({
                type: currentTool,
                x: worldX,
                y: worldY
            });
        }
        camera.isDragging = false;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = 1.1;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const worldX = mouseX / camera.zoom + camera.x;
        const worldY = mouseY / camera.zoom + camera.y;

        if (e.deltaY < 0) {
            camera.zoom *= zoomFactor;
        } else {
            camera.zoom /= zoomFactor;
        }

        camera.zoom = Math.max(0.3, Math.min(3, camera.zoom));

        camera.x = worldX - mouseX / camera.zoom;
        camera.y = worldY - mouseY / camera.zoom;
    }, { passive: false });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        const gridSize = 100;
        for (let x = 0; x <= WORLD_WIDTH; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, WORLD_HEIGHT);
            ctx.stroke();
        }
        for (let y = 0; y <= WORLD_HEIGHT; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(WORLD_WIDTH, y);
            ctx.stroke();
        }

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 6;
        ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        elements.forEach(el => {
            const cfg = toolConfig[el.type];
            if (!cfg) return;

            ctx.save();
            ctx.translate(el.x, el.y);

            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.arc(0, cfg.size/2, cfg.size/2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = cfg.color;
            ctx.beginPath();
            ctx.arc(0, 0, cfg.size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(cfg.icon, 0, 0);

            ctx.restore();
        });

        ctx.restore();

        hud.innerText = `Zoom: ${Math.round(camera.zoom * 100)}% | Elementos: ${elements.length}`;

        requestAnimationFrame(draw);
    }

    draw();
</script>

</body>
</html>
